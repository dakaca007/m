services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src:/var/www/html/src
      - ./public:/var/www/html/public
      - ./config:/var/www/html/config
    networks:
      - phalapi-network

 

  nginx:
    image: nginx:latest
    volumes:
      - ./public:/var/www/html/public
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    networks:
      - phalapi-network

  

networks:
  phalapi-network:
    driver: bridge

volumes:
  db_data: